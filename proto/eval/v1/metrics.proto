// BigQuery row schemas. Source of truth for the eval_results dataset.
//
// `protoc-gen-bq-schema` consumes this file to emit schemas/bq/*.json.
// Field tags use proto3 JSON names (camelCase) when serialized.
syntax = "proto3";

package eval.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "proto/eval/v1/manifest.proto";

// One row per run. Partitioned on DATE(timestamp_utc), clustered on model_id.
message EvalRun {
  string run_id = 1;            // primary key
  string name = 2;
  RunStatus status = 3;
  string user_id = 4;
  google.protobuf.Timestamp timestamp_utc = 5;
  ExecutionMode execution_mode = 6;

  string model_id = 7;
  string endpoint_id = 8;

  string harness_version = 9;
  string wrapper_commit = 10;
  string image_digest = 11;
  string config_sha256 = 12;

  string gcs_uri = 13;          // gs://eval-artifacts-prod/runs/<run_id>/
  google.protobuf.Struct tags = 14;

  double total_seconds = 15;
  string vertex_job_id = 16;
}

// Long-format metrics. One row per (run_id, task, metric, filter).
// Clustered on (model_id, task) via join with EvalRun.
message EvalMetric {
  string run_id = 1;            // foreign key to EvalRun
  string task = 2;
  string metric = 3;
  string filter = 4;            // e.g. "strict-match", "flexible-extract", or "" if N/A
  double score = 5;
  double stderr = 6;
  int64 n_samples = 7;
  bool higher_is_better = 8;
}

// Forensic store: full manifest as a JSON column for ad-hoc queries.
message EvalManifestRaw {
  string run_id = 1;
  string manifest_json = 2;     // serialized RunManifest as proto3 JSON
  google.protobuf.Timestamp ingested_at = 3;
}
