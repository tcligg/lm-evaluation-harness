# Demo config for the MERIT walkthrough. Purposely short and
# fits on one terminal screen.
#
# This config targets a Vertex chat endpoint (REPLACE_ME shown
# intentionally so the audience sees what gets validated and what
# gets translated literally into the lm_eval command).

schema_version: 1

run:
  name: demo_smoke_gpqa
  tags:
    audience: engineering-demo
    owner: tcli

harness:
  version: "0.4.12.dev0"

endpoint:
  type: vertex_chat
  model_id: google/openmaas-2.0-test
  endpoint_id: "projects/<PROJ>/locations/us-central1/endpoints/<ID>"
  base_url: "https://us-central1-staging-aiplatform.sandbox.googleapis.com/v1/projects/<PROJ>/locations/us-central1/endpoints/<ID>/chat/completions"
  auth:
    mode: gcloud_adc

tasks:
  - name: gpqa_diamond_generative_n_shot
    num_fewshot: 3
    metrics: [exact_match]

model_args:
  num_concurrent: 8
  max_gen_toks: 4096
  timeout: 60

gen_kwargs:
  until: "<|eos|>"

seed: [0, 1234, 1234, 1234]

limits:
  per_task: 1   # demo: cap to 1 doc/task

chat_template:
  mode: MODE_AUTO
  fewshot_as_multiturn: true
