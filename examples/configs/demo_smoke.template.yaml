# Demo config template for the MERIT walkthrough.
#
# Tokens (@@PROJECT@@, @@REGION@@, @@ENDPOINT@@) get substituted by
# `make demo-seed` using these env vars (defaults shown):
#   MERIT_DEMO_PROJECT  = cloud-llm-preview1
#   MERIT_DEMO_REGION   = us-central1
#   MERIT_DEMO_ENDPOINT = grok-4p20-non-reasoning-h200
#
# Override per-demo:
#   make demo-seed MERIT_DEMO_PROJECT=my-proj \
#                  MERIT_DEMO_ENDPOINT=my-endpoint
#
# The rendered file lands at /tmp/demo/demo_smoke.yaml.

schema_version: 1

run:
  name: demo_smoke_gpqa
  tags:
    audience: engineering-demo
    owner: tcli
    project: "@@PROJECT@@"

harness:
  version: "0.4.12.dev0"

endpoint:
  type: vertex_chat
  model_id: google/openmaas-2.0-test
  endpoint_id: "projects/@@PROJECT@@/locations/@@REGION@@/endpoints/@@ENDPOINT@@"
  base_url: "https://@@REGION@@-staging-aiplatform.sandbox.googleapis.com/v1/projects/@@PROJECT@@/locations/@@REGION@@/endpoints/@@ENDPOINT@@/chat/completions"
  auth:
    mode: gcloud_adc

tasks:
  - name: gpqa_diamond_generative_n_shot
    num_fewshot: 3
    metrics: [exact_match]

model_args:
  num_concurrent: 8
  max_gen_toks: 4096
  timeout: 60

gen_kwargs:
  until: "<|eos|>"

seed: [0, 1234, 1234, 1234]

limits:
  per_task: 1   # demo: cap to 1 doc/task

chat_template:
  mode: MODE_AUTO
  fewshot_as_multiturn: true
