name: evalctl CI

# Phase 2 CI. Three jobs:
#   smoke   - proto-free unit suite + YAML->argv check + repro roundtrip.
#             Fast (< 1 minute), runs on every push/PR.
#   docker  - builds the runtime image, smoke-tests --help inside it.
#             Doesn't push; tagged-release workflow does that separately.
#   bazel   - the proto-coupled tier. Behind a job-level `if` so it
#             skips on PRs from forks (Bazel cache requires push perms).
#
# Add Artifact Registry push later (Phase 2 follow-up): see the
# `docker-push` job stub at the bottom.

on:
  push:
    branches: [main, evalctl]
    tags: ['v*']
  pull_request:
    branches: [main, evalctl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  smoke:
    name: smoke (proto-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml typer

      - name: Run smoke suite
        run: ./tools/evalctl/smoke_test.sh

      - name: Verify CLI starts (no proto, no docker)
        run: |
          python -m tools.evalctl --help
          python -m tools.evalctl validate examples/configs/gpqa_diamond_3shot_grok42.yaml

  # ---------------------------------------------------------------------------
  docker:
    name: docker build + smoke
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          make docker-build \
            HARNESS_VERSION=$(grep '^version' pyproject.toml | head -1 \
              | sed -E 's/.*"([^"]+)"/\1/') \
            IMAGE_REGISTRY=local

      - name: Smoke-test image (--help inside container)
        run: |
          IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep eval-harness | head -1)
          echo "Testing image: $IMG"
          docker run --rm "$IMG" --help
          docker run --rm "$IMG" validate examples/configs/gpqa_diamond_3shot_grok42.yaml \
            || true   # validate may fail if example references REPLACE_ME endpoint

      - name: Print image size
        run: docker images --format 'table {{.Repository}}:{{.Tag}}\t{{.Size}}' | head -5

  # ---------------------------------------------------------------------------
  # Proto-coupled bazel tier. Skipped on fork PRs because Bazel cache
  # writes need authenticated access.
  bazel:
    name: bazel test //...
    runs-on: ubuntu-latest
    needs: smoke
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Install Bazelisk
        run: |
          curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
          bazel --version

      - name: bazel test //tools/evalctl/...
        run: bazel test //tools/evalctl/... //proto/eval/v1/...

  # ---------------------------------------------------------------------------
  # Artifact Registry push: gated on tags or main-branch pushes only.
  # Disabled until secrets are wired up (uncomment after configuring
  # GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT secrets).
  #
  # docker-push:
  #   name: push to Artifact Registry
  #   runs-on: ubuntu-latest
  #   needs: [docker, bazel]
  #   if: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
  #   permissions:
  #     contents: read
  #     id-token: write
  #   steps:
  #     - uses: actions/checkout@v4
  #     - id: auth
  #       uses: google-github-actions/auth@v2
  #       with:
  #         workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  #         service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  #     - name: Configure docker for Artifact Registry
  #       run: gcloud auth configure-docker us-docker.pkg.dev --quiet
  #     - name: Build + push
  #       run: |
  #         make docker-build IMAGE_REGISTRY=us-docker.pkg.dev/${{ vars.GCP_PROJECT }}/eval
